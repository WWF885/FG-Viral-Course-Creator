<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>精品课程动态模板</title><style>*{box-sizing:border-box}body{margin:0;background:#081e26;color:#f0f9f6;font:16px system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}.stage{background:#102d35;width:min(100vw,177.78vh);aspect-ratio:16/9;display:grid;grid-template-rows:auto 1fr auto;padding:2%;gap:8px}nav,footer{display:flex;gap:5px;align-items:center;flex-wrap:wrap}button{background:#244f57;color:white;border:1px solid #638a8d;border-radius:6px;padding:6px 10px;cursor:pointer}button[aria-current=true]{background:#126f66;border-color:#a4e8d4}button:disabled{opacity:.4}main{min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(18px,3vw,42px);margin:0}#visual svg{width:100%;max-height:48vh;display:block}#visual{text-align:center}#note{font-size:clamp(12px,1.6vw,22px);color:#bedbd5}footer span{margin-right:auto}@media(max-width:600px){.stage{aspect-ratio:auto;min-height:100vh}#visual svg{max-height:none}}</style><div class="stage" id="stage"><nav id="nav" aria-label="章节导航"></nav><main><h1 id="title"></h1><div id="visual"></div><div id="note" aria-live="polite"></div></main><footer><span id="status"></span><button id="prev">上一页</button><button id="next">下一步 / 下一页</button><button id="full">全屏</button></footer></div><script src="../assets/visuals.js"></script><script>
const slides=[{id:'S01',phase:'引',title:'为什么要先核实资料？',type:'compare',labels:['凭印象生成','依据事实生成'],notes:['容易出错','先核实再生成'],steps:['想一想：哪些信息经常被问到？']},{id:'S02',phase:'果',title:'展示学习成果',type:'summary',labels:['服务卡','事实依据'],notes:['可导出','可检查'],steps:['教学模拟示例；不是实际商家。']},{id:'S03',phase:'知',title:'资料与内容的关系',type:'architecture',center:'可靠资料',labels:['整理','内容','审核'],steps:['先明确来源。','未知信息标记待核实。']},{id:'S04',phase:'法',title:'四步方法',type:'flow',labels:['收集','核实','生成','审核'],steps:['先收集。','再核实。','生成后人工审核。']},{id:'S05',phase:'例',title:'模拟案例',type:'story',labels:['客户提问','资料整理','介绍卡','人工复核'],steps:['示例不含真实经营数据。']},{id:'S06',phase:'做',title:'动手练习',type:'steps',labels:['填写','核实','生成','检查'],steps:['跟着完成一次。']},{id:'S07',phase:'练',title:'换成自己的项目',type:'quiz',question:'哪一步先做？',labels:['核实资料','编造卖点'],answer:0,steps:['请独立完成，并记录依据。']},{id:'S08',phase:'验',title:'成果验收',type:'summary',labels:['准确','完整','可用','隐私'],notes:['40分','30分','20分','10分'],steps:['80分为演示门槛；虚构事实不通过。']}];let i=0,k=0;const $=s=>document.getElementById(s);function draw(){let s=slides[i];$('title').textContent=s.id+'｜'+s.title;CourseVisuals.render($('visual'),s.type,s);$('note').textContent=s.steps[k]||'';$('status').textContent=`${i+1}/${slides.length} · ${s.phase} · ${k+1}/${s.steps.length}`;[...$('nav').children].forEach((b,j)=>b.setAttribute('aria-current',String(i===j)));$('prev').disabled=i===0&&k===0;$('next').disabled=i===slides.length-1&&k===s.steps.length-1;}function go(j){i=j;k=0;draw()}function next(){if(k+1<slides[i].steps.length){k++;$('note').textContent=slides[i].steps[k];$('status').textContent=`${i+1}/${slides.length} · ${slides[i].phase} · ${k+1}/${slides[i].steps.length}`;$('prev').disabled=false;$('next').disabled=i===slides.length-1&&k===slides[i].steps.length-1;}else if(i+1<slides.length)go(i+1)}function prev(){if(k>0){k--;draw()}else if(i>0)go(i-1)}slides.forEach((s,j)=>{let b=document.createElement('button');b.textContent=s.phase;b.onclick=()=>go(j);$('nav').append(b)});$('next').onclick=next;$('prev').onclick=prev;async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else if($('stage').requestFullscreen)await $('stage').requestFullscreen();}catch(e){$('note').textContent='此浏览器无法进入全屏，请使用浏览器全屏。'}}$('full').onclick=full;document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}else if(e.key.toLowerCase()==='f')full()});draw();</script></html>
