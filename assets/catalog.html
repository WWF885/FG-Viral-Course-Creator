<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>26类知识可视化组件</title><style>body{background:#102d35;color:#eef7f4;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}article{background:#193f48;border-radius:12px;padding:14px}svg{width:100%;display:block}button{background:#d4efe6;color:#133e38;border:0;padding:8px;margin:4px;border-radius:5px}p{color:#b9d7d2}</style><h1>知识可视化组件库</h1><p>26个离线SVG组件，所有数据为演示值。使用 visuals.js 的 render(root, type, data) 复用，按教学内容替换标签和数值。</p><main id="catalog"></main><script src="visuals.js"></script><script>for(const [id,name] of Object.entries(CourseVisuals.names)){let a=document.createElement('article'),h=document.createElement('h2'),b=document.createElement('div');h.textContent=name;a.dataset.type=id;a.append(h,b);document.getElementById('catalog').append(a);CourseVisuals.render(b,id,{labels:['收集','核实','生成','审核'],values:[25,50,75,90],center:'核心目标'});}</script></html>
